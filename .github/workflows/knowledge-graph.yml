name: Knowledge graph

# Fails when graphify-out/graph.json no longer matches the source tree, so a PR
# cannot land code that agents will then answer questions about from a stale graph.
#
# The rebuild is AST-only (tree-sitter, local) — no LLM backend and no API key.
# See docs/knowledge-graph.md.

on:
  # This job is required by branch protection, so every PR to main must
  # report it. Workflow-level path filters leave other PRs pending forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Graph is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Only the base package — `graphify update` needs tree-sitter, not the
      # mcp/pdf extras, and pulling fewer wheels keeps this job quick.
      # Pin the extractor so local refreshes and CI do not disagree when
      # graphify changes its AST schema.
      - name: Install graphify
        run: pip install "graphifyy==0.9.48"

      - name: Check graph freshness
        run: python3 scripts/check_graph_fresh.py

      # The graph is only as useful as it is used; surfacing the number keeps the
      # tradeoff visible rather than assumed.
      - name: Report token reduction
        if: success()
        run: graphify benchmark || true
