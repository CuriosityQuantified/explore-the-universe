# CI for explore-the-universe.
#
# Continuous integration: every push to main and every pull request runs the
# test suite and the web build. Graph freshness is gated separately by
# .github/workflows/knowledge-graph.yml (the same role as lit's "Code graph"
# job and deep-knowledge's "Graph freshness gate").
#
# The Python tests are integration tests by construction — they hit the live
# FastAPI server (localhost:8000) and its service stack, exactly as the phase
# docs describe (pytest tests/test_health.py -v against `uvicorn api.main:app`).
# So this job brings up docker-compose (PostgreSQL, Redis, MinIO, Neo4j),
# starts the API, waits until /health returns 200 (which only happens when ALL
# four services are connected), then runs the suite.
#
# `-m "not slow"` excludes test_full_pipeline_integration, which downloads
# real JWST data from MAST and runs the entire pipeline — a manual run, not a
# CI gate.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast offline unit tests — no docker, no live services, no network. These
  # are the pure-Python suites: Celery task registration/chain shape, the
  # Phase 5 classification schema + catalog clients (retry/not_queried
  # sentinel behavior is mocked), and graphify knowledge-graph queries. They
  # run in seconds and catch import/schema/chain regressions before the
  # docker-dependent integration suite below.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libvips
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run offline unit tests
        run: python -m pytest tests/test_celery.py tests/test_classification_schema.py tests/test_knowledge_graph.py tests/test_anomaly_api.py tests/test_search_api.py tests/test_object_detail_api.py tests/test_observations_api.py tests/test_load_graph.py tests/test_name_search_api.py tests/test_export_api.py -q

  # The service-dependent Python suite. Docker is available on the runner; the
  # compose file needs no secrets (shared/config.py defaults match it).
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libvips
        # pyvips>=3.1.0 (a declared dependency) needs libvips on Linux; the
        # tests never import it, but `pip install -e .` will try to build/load
        # it. Cheap insurance.
        run: sudo apt-get update && sudo apt-get install -y libvips-dev

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start service stack
        # Postgres, Redis, MinIO (+ bucket init), Neo4j — the whole compose
        # file. Config defaults in shared/config.py match these credentials.
        # --wait blocks until postgres passes its pg_isready healthcheck, so
        # migrations never race a half-initialized server.
        run: docker compose up -d --wait

      - name: Apply database migrations
        # The stack comes up with an empty Postgres; the health check only
        # runs SELECT version(), so it passes on a schema-less DB. Writes to
        # observations etc. 500 without the tables — `alembic upgrade head`
        # is a documented step in every phase plan.
        run: python -m alembic upgrade head

      - name: Start API server and wait for full health
        # /health returns 503 until postgres, redis, minio AND neo4j all
        # answer — so a 200 means the stack is genuinely ready, not just that
        # the process is listening. Neo4j takes the longest to come up.
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          # NOTE: no trap / no kill here — GitHub Actions keeps background
          # processes alive across steps, and the runner reaps them when the
          # job ends. A `trap ... EXIT` would kill the server as soon as THIS
          # step's shell exits, before the test step runs.
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "API healthy after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1 \
            || { echo "API never became healthy (services not ready)"; exit 1; }

      - name: Run tests
        run: python -m pytest -m "not slow" -q

  # The web half: production build of the Next.js viewer. Lint is deliberately
  # not a gate here — the repo has no lint baseline yet (pre-existing errors
  # in the viewer components); build is the compile check that catches real
  # breakage.
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build production bundle
        run: npm run build
        working-directory: web
