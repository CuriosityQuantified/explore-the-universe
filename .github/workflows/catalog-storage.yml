name: Provision catalog storage
on:
  workflow_dispatch:
  push:
    branches: [codex/catalog-ingestion]
    paths: [.github/workflows/catalog-storage.yml]
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Railway imagery bucket and configure services
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          project = os.environ['RAILWAY_PROJECT_ID']
          def query(document, variables):
              request = urllib.request.Request('https://backboard.railway.com/graphql/v2',
                  data=json.dumps({'query': document, 'variables': variables}).encode(),
                  headers={'Content-Type': 'application/json', 'User-Agent': 'universe-storage/1.0',
                           'Authorization': 'Bearer ' + os.environ['RAILWAY_API_TOKEN']})
              with urllib.request.urlopen(request, timeout=45) as response:
                  result = json.load(response)
              if result.get('errors'):
                  raise RuntimeError(json.dumps(result['errors']))
              return result['data']
          data = query('query($p:String!){project(id:$p){environments{edges{node{id name}}} buckets{edges{node{id name}}} services{edges{node{id name}}}}}', {'p':project})['project']
          environment = next(e['node']['id'] for e in data['environments']['edges'] if e['node']['name']=='production')
          buckets = [e['node'] for e in data['buckets']['edges'] if e['node']['name']=='universe-imagery']
          bucket = buckets[0] if buckets else query('mutation($i:BucketCreateInput!){bucketCreate(input:$i){id name}}', {'i':{'projectId':project,'environmentId':environment,'name':'universe-imagery'}})['bucketCreate']
          print('Imagery bucket:', bucket['id'], flush=True)
          credentials = None
          for attempt in range(12):
              entries = query('query($p:String!,$e:String!,$b:String!){bucketS3Credentials(projectId:$p,environmentId:$e,bucketId:$b){accessKeyId secretAccessKey bucketName endpoint region urlStyle}}', {'p':project,'e':environment,'b':bucket['id']})['bucketS3Credentials']
              if entries:
                  credentials = entries[0]
                  break
              time.sleep(5)
          if not credentials:
              raise SystemExit('Bucket credentials are not ready')
          for key in ('accessKeyId','secretAccessKey'):
              print('::add-mask::' + credentials[key], flush=True)
          values = {'CATALOG_S3_BUCKET':credentials['bucketName'], 'CATALOG_S3_ENDPOINT_URL':credentials['endpoint'],
                    'CATALOG_S3_ACCESS_KEY':credentials['accessKeyId'], 'CATALOG_S3_SECRET_KEY':credentials['secretAccessKey'],
                    'CATALOG_S3_REGION':credentials['region']}
          for edge in data['services']['edges']:
              service = edge['node']
              if service['name'] in ('api','worker'):
                  query('mutation($i:VariableCollectionUpsertInput!){variableCollectionUpsert(input:$i)}',
                        {'i':{'projectId':project,'environmentId':environment,'serviceId':service['id'],
                              'variables':values,'skipDeploys':True}})
                  print('Configured catalog storage for', service['name'], flush=True)
          PY
