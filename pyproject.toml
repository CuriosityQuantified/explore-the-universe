[project]
name = "explore-the-universe"
version = "0.1.0"
description = "A galactic encyclopedia: JWST imagery segmented, classified, and explorable"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.7.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
    "neo4j>=5.26.0",
    "python-multipart>=0.0.18",
    # Astronomy stack
    "astropy>=7.0",
    "astroquery>=0.4.11",
    "pyvips>=3.1.0",  # Requires: brew install vips (macOS) or apt install libvips-dev (Linux)
    "Pillow>=10.0",
    # Segmentation stack
    "sep>=1.4.0",  # Astronomical source detection (C backend, SExtractor algorithms)
    "photutils>=2.3.0",  # Extended source detection and deblending
    "pycocotools>=2.0.11",  # COCO RLE mask encoding/decoding
    # Classification stack (Phase 5)
    "scikit-learn>=1.4.0",
    "statmorph>=0.7.1",
    # NOTE: torch/torchvision/sam3 are optional GPU dependencies installed separately.
    # They are not declared here because they require CUDA-specific pip index URLs
    # and are only needed for the SAM segmentation task (Plan 04-02).
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]
# Knowledge graph tooling. Builds graphify-out/ from the codebase so agents and
# humans can query relationships instead of grepping. See docs/knowledge-graph.md.
# The [mcp] extra provides the `graphify-mcp` stdio server wired up in .mcp.json.
graph = [
    "graphifyy[mcp,pdf]>=0.9.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "pipeline", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
