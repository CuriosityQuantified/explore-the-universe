[project]
name = "explore-the-universe"
version = "0.1.0"
description = "A galactic encyclopedia: JWST imagery segmented, classified, and explorable"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.7.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "boto3>=1.35.0",
    "neo4j>=5.26.0",
    "python-multipart>=0.0.18",
    # Astronomy stack
    "astropy>=7.0",
    "astroquery>=0.4.11",
    "pyvips>=3.1.0",  # Requires: brew install vips (macOS) or apt install libvips-dev (Linux)
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "pipeline", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
